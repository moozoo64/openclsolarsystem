name: CI-ubuntu

on:
  workflow_call:
    inputs:
      create_release:
        description: "Create new release"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create new release"
        required: true
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      [
        ".github/workflows/ubuntu.yaml",
        "**/CMakeLists.txt",
        "**/Makefile",
        "**/*.h",
        "**/*.hpp",
        "**/*.c",
        "**/*.cpp",
        "**/*.cl",
        "**/*.cs",
        "**/*.sln",
        "**/*.csproj",
        "**/appsettings.json",
        "tools/kernel-harness/**",
      ]
permissions:
  contents: write

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  RELEASE_VERSION: ${{ github.event.inputs.create_release && github.run_number }}
  SHOULD_RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.inputs.create_release == 'true' }}
  SHOULD_UPLOAD_ARTIFACT: ${{ github.ref == 'refs/heads/develop' && github.event.inputs.create_release == 'true' }}
  BUILD_DATE: ${{ github.event.repository.updated_at }}

jobs:
  ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - name: Install OpenCLSolarSystem dependencies
        run: |
          sudo apt update
          sudo apt install build-essential git cmake ninja-build libgl1-mesa-dev libglew-dev opencl-headers ocl-icd-opencl-dev libwxgtk3.2-dev imagemagick

      - name: Checkout OpenCLSolarSystem
        uses: actions/checkout@v7
        with:
          path: openclsolarsystem
          fetch-depth: 0

      - name: Build OpenCLSolarSystem
        run: |
          cd openclsolarsystem
          cmake -B build -S src/OpenCLSolarSystem -DCMAKE_BUILD_TYPE=Release -DOpenGL_GL_PREFERENCE=GLVND
          cmake --build build --config Release -j$(nproc)

      # Physics regression checks (tools/kernel-harness/checks.py) on the real OpenCL kernels,
      # run on the CPU with PoCL. Runs before packaging so a failure stops the release.
      - name: Install kernel check dependencies (PoCL, Python)
        run: |
          sudo apt install -y pocl-opencl-icd clinfo python3-venv
          clinfo -l
          python3 -m venv .venv
          .venv/bin/pip install -r openclsolarsystem/tools/kernel-harness/requirements.txt

      - name: Run kernel regression checks
        run: |
          .venv/bin/python openclsolarsystem/tools/kernel-harness/checks.py --platform "Portable Computing Language"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x.x"

      - name: Build OrbToSlf using dotnet
        run: |
          cd openclsolarsystem/src/OrbToSlf
          # Build main projects to a specific output directory
          dotnet publish OrbToSlfConsole/OrbToSlfConsole.csproj --configuration Release --framework net10.0 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./OrbToSlfConsole/bin/Release/publish
          # Build and run tests with coverage
          dotnet test --configuration Release --collect:"XPlat Code Coverage" --results-directory:"./OrbToSlfConsole/bin/Release/TestResults" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          cd openclsolarsystem
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          SHORT_HASH="$(git rev-parse --short=7 HEAD)"
          if [[ "${{ env.BRANCH_NAME }}" == "master" ]]; then
            echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          else
            SAFE_NAME=$(echo "${{ env.BRANCH_NAME }}" | tr '/' '-')
            echo "name=${SAFE_NAME}-b${BUILD_NUMBER}-${SHORT_HASH}" >> $GITHUB_OUTPUT
          fi

      - name: Create package directory structure
        run: |
          mkdir -p .debpkg/usr/bin
          mkdir -p .debpkg/usr/share/openclsolarsystem/OrbToSlf
          # Add icon directories
          mkdir -p .debpkg/usr/share/icons/hicolor/256x256/apps
          mkdir -p .debpkg/usr/share/icons/hicolor/128x128/apps
          mkdir -p .debpkg/usr/share/icons/hicolor/64x64/apps
          mkdir -p .debpkg/usr/share/icons/hicolor/48x48/apps
          mkdir -p .debpkg/usr/share/icons/hicolor/32x32/apps
          mkdir -p .debpkg/usr/share/icons/hicolor/16x16/apps
          # Add desktop file directory
          mkdir -p .debpkg/usr/share/applications
          cp -r openclsolarsystem/build/bin/* .debpkg/usr/bin/
          cp openclsolarsystem/src/OrbToSlf/OrbToSlfConsole/mpcsmall.slf .debpkg/usr/share/openclsolarsystem
          cp -r openclsolarsystem/src/OrbToSlf/OrbToSlfConsole/bin/Release/publish/* .debpkg/usr/share/openclsolarsystem/OrbToSlf
          # Copy icon to all required sizes
          for size in 16 32 48 64 128 256; do
            convert openclsolarsystem/src/OpenCLSolarSystem/icon.png -resize ${size}x${size} .debpkg/usr/share/icons/hicolor/${size}x${size}/apps/openclsolarsystem.png
          done
          # Copy the .desktop file
          cp openclsolarsystem/src/OpenCLSolarSystem/openclsolarsystem.desktop .debpkg/usr/share/applications/

      - name: Build .deb package
        uses: jiro4989/build-deb-action@v4
        with:
          package: openclsolarsystem
          package_root: .debpkg
          maintainer: "Michael Simmons <moozoo.wizard@gmail.com>"
          version: "1.0.${{ github.run_number }}"
          arch: "amd64"
          depends: "libglew2.2, libglu1-mesa, libwxgtk-gl3.2-1t64, libwxgtk3.2-1t64, libwxbase3.2-1t64, ocl-icd-libopencl1, dotnet-runtime-10.0"
          desc: "opencl solar system simulator"
          homepage: "https://github.com/moozoo64/openclsolarsystem"
        id: build

      - name: Rename .deb package to match naming convention
        run: |
          mkdir -p artifacts
          cp ${{ steps.build.outputs.file_name }} artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-ubuntu2404-Release.deb

      - name: Generate SHA256 checksum
        run: |
          cd artifacts
          sha256sum OpenClSolarSystem-${{ steps.tag.outputs.name }}-ubuntu2404-Release.deb | awk '{print $1}' > OpenClSolarSystem-${{ steps.tag.outputs.name }}-ubuntu2404-Release.sha256

      - name: VirusTotal scan
        id: vt
        if: ${{ env.SHOULD_RELEASE == 'true' || env.SHOULD_UPLOAD_ARTIFACT == 'true' }}
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-ubuntu2404-Release.deb

      - name: Show VirusTotal link
        if: ${{ steps.vt.outputs.analysis != '' }}
        env:
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          IFS=',' read -ra entries <<< "$VT_ANALYSIS"
          for entry in "${entries[@]}"; do
            echo "- VirusTotal: [${entry%%=*}](${entry#*=})" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload .deb artifact
        if: ${{ env.SHOULD_RELEASE == 'true' || env.SHOULD_UPLOAD_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenClSolarSystem-${{ steps.tag.outputs.name }}-ubuntu2404-Release.deb
          path: artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-ubuntu2404-Release.deb

      - name: Upload SHA256 checksum
        if: ${{ env.SHOULD_RELEASE == 'true' || env.SHOULD_UPLOAD_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenClSolarSystem-${{ steps.tag.outputs.name }}-ubuntu2404-Release.sha256
          path: artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-ubuntu2404-Release.sha256
