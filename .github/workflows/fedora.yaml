name: CI-fedora

# Builds a binary .rpm on CentOS Stream 9 (EL9 + EPEL). EL9 has the oldest glibc of the
# targeted distros, so the same package installs on EL9/EL10 (CentOS Stream, RHEL, Rocky,
# Alma - with EPEL enabled) and current Fedora. Library dependencies are generated by
# rpmbuild from the binary's sonames, so they resolve on each distro whatever its package
# names are. The verify job installs the built rpm on each target to prove that.

on:
  workflow_call:
    inputs:
      create_release:
        description: "Create new release"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create new release"
        required: true
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      [
        ".github/workflows/fedora.yaml",
        "**/CMakeLists.txt",
        "**/Makefile",
        "**/*.h",
        "**/*.hpp",
        "**/*.c",
        "**/*.cpp",
        "**/*.cl",
        "**/*.cs",
        "**/*.sln",
        "**/*.csproj",
        "**/appsettings.json",
      ]

permissions:
  contents: write

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  RELEASE_VERSION: ${{ github.event.inputs.create_release && github.run_number }}
  SHOULD_RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.inputs.create_release == 'true' }}
  SHOULD_UPLOAD_ARTIFACT: ${{ github.ref == 'refs/heads/develop' && github.event.inputs.create_release == 'true' }}
  BUILD_DATE: ${{ github.event.repository.updated_at }}
  PKG_SUFFIX: fedora-el9-Release

jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: quay.io/centos/centos:stream9

    outputs:
      tag: ${{ steps.tag.outputs.name }}

    steps:
      - name: Install OpenCLSolarSystem dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          dnf install -y \
            git tar gzip rpm-build \
            gcc-c++ make cmake ninja-build \
            mesa-libGL-devel mesa-libGLU-devel glew-devel \
            opencl-headers ocl-icd-devel \
            wxGTK-devel \
            ImageMagick \
            dotnet-sdk-10.0

      - name: Checkout OpenCLSolarSystem
        uses: actions/checkout@v7
        with:
          path: openclsolarsystem
          fetch-depth: 0

      - name: Mark repository safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/openclsolarsystem"

      - name: Build OpenCLSolarSystem
        run: |
          cd openclsolarsystem
          WX_CONFIG="$(command -v wx-config || command -v wx-config-3.2)"
          cmake -B build -S src/OpenCLSolarSystem -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOpenGL_GL_PREFERENCE=GLVND -DwxWidgets_CONFIG_EXECUTABLE="$WX_CONFIG"
          cmake --build build --config Release -j$(nproc)

      - name: Build OrbToSlf using dotnet
        run: |
          cd openclsolarsystem/src/OrbToSlf
          dotnet publish OrbToSlfConsole/OrbToSlfConsole.csproj --configuration Release --framework net10.0 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ./OrbToSlfConsole/bin/Release/publish
          dotnet test --configuration Release

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          cd openclsolarsystem
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          SHORT_HASH="$(git rev-parse --short=7 HEAD)"
          if [[ "${{ env.BRANCH_NAME }}" == "master" ]]; then
            echo "name=b${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          else
            SAFE_NAME=$(echo "${{ env.BRANCH_NAME }}" | tr '/' '-')
            echo "name=${SAFE_NAME}-b${BUILD_NUMBER}-${SHORT_HASH}" >> $GITHUB_OUTPUT
          fi

      - name: Create package directory structure
        run: |
          ROOT="$GITHUB_WORKSPACE/.rpmroot"
          mkdir -p "$ROOT/usr/bin"
          mkdir -p "$ROOT/usr/share/openclsolarsystem/OrbToSlf"
          mkdir -p "$ROOT/usr/share/applications"
          cp -r openclsolarsystem/build/bin/* "$ROOT/usr/bin/"
          cp openclsolarsystem/src/OrbToSlf/OrbToSlfConsole/mpcsmall.slf "$ROOT/usr/share/openclsolarsystem/"
          cp -r openclsolarsystem/src/OrbToSlf/OrbToSlfConsole/bin/Release/publish/* "$ROOT/usr/share/openclsolarsystem/OrbToSlf/"
          for size in 16 32 48 64 128 256; do
            mkdir -p "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps"
            convert openclsolarsystem/src/OpenCLSolarSystem/icon.png -resize ${size}x${size} "$ROOT/usr/share/icons/hicolor/${size}x${size}/apps/openclsolarsystem.png"
          done
          cp openclsolarsystem/src/OpenCLSolarSystem/openclsolarsystem.desktop "$ROOT/usr/share/applications/"

      - name: Write spec file
        run: |
          cat > openclsolarsystem.spec <<'EOF'
          # Binary-only package: everything is prebuilt into %{stageroot}.
          %global debug_package %{nil}
          %global _build_id_links none
          # No brp scripts: stripping would corrupt the .NET single-file bundle (OrbToSlfConsole).
          %global __os_install_post %{nil}
          # Do not generate deps from the managed .NET payload; the runtime is required explicitly.
          %global __requires_exclude_from ^/usr/share/openclsolarsystem/OrbToSlf/.*\\.(dll|so)$
          %global __provides_exclude_from ^/usr/share/openclsolarsystem/OrbToSlf/.*$

          Name:           openclsolarsystem
          Version:        %{pkg_version}
          Release:        1
          Summary:        OpenCL solar system simulator
          License:        Apache-2.0
          URL:            https://github.com/moozoo64/openclsolarsystem
          ExclusiveArch:  x86_64

          # Shared libraries (wxGTK 3.2, GLEW, GLU, OpenCL ICD loader) are added automatically
          # from the binary's sonames.
          Requires:       dotnet-runtime-10.0
          Requires:       hicolor-icon-theme

          %description
          N-body solar system simulator using OpenCL for the integration and OpenGL for display.
          Includes the OrbToSlf tool for converting MPC orbit files.

          %install
          cp -a %{stageroot}/. %{buildroot}/

          %files
          %license %{licensefile}
          /usr/bin/OpenCLSolarSystem
          /usr/share/openclsolarsystem
          /usr/share/applications/openclsolarsystem.desktop
          /usr/share/icons/hicolor/*/apps/openclsolarsystem.png
          EOF
          cat openclsolarsystem.spec

      - name: Build .rpm package
        run: |
          rpmbuild -bb openclsolarsystem.spec \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "pkg_version 1.0.${{ github.run_number }}" \
            --define "stageroot $GITHUB_WORKSPACE/.rpmroot" \
            --define "licensefile $GITHUB_WORKSPACE/openclsolarsystem/license.txt"
          RPM_FILE="$(ls rpmbuild/RPMS/x86_64/openclsolarsystem-*.rpm)"
          echo "--- Requires ---"
          rpm -qp --requires "$RPM_FILE"
          mkdir -p artifacts
          cp "$RPM_FILE" artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.rpm

      - name: Generate SHA256 checksum
        run: |
          cd artifacts
          sha256sum OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.rpm | awk '{print $1}' > OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.sha256

      # Always uploaded (short retention) so the verify job can install it.
      - name: Upload rpm for install verification
        uses: actions/upload-artifact@v6
        with:
          name: rpm-verify
          path: artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.rpm
          retention-days: 1

      - name: VirusTotal scan
        id: vt
        if: ${{ env.SHOULD_RELEASE == 'true' || env.SHOULD_UPLOAD_ARTIFACT == 'true' }}
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.rpm

      - name: Show VirusTotal link
        if: ${{ steps.vt.outputs.analysis != '' }}
        shell: bash
        env:
          VT_ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          IFS=',' read -ra entries <<< "$VT_ANALYSIS"
          for entry in "${entries[@]}"; do
            echo "- VirusTotal: [${entry%%=*}](${entry#*=})" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload .rpm artifact
        if: ${{ env.SHOULD_RELEASE == 'true' || env.SHOULD_UPLOAD_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.rpm
          path: artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.rpm

      - name: Upload SHA256 checksum
        if: ${{ env.SHOULD_RELEASE == 'true' || env.SHOULD_UPLOAD_ARTIFACT == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.sha256
          path: artifacts/OpenClSolarSystem-${{ steps.tag.outputs.name }}-${{ env.PKG_SUFFIX }}.sha256

  # Install the rpm on each target distro and check every shared library resolves.
  verify:
    needs: rpm
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fedora-latest, image: "registry.fedoraproject.org/fedora:latest", epel: false }
          - { name: centos-stream9, image: "quay.io/centos/centos:stream9", epel: true }
          - { name: centos-stream10, image: "quay.io/centos/centos:stream10", epel: true }

    steps:
      - name: Enable EPEL
        if: ${{ matrix.epel }}
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y epel-release

      - name: Download rpm
        uses: actions/download-artifact@v4
        with:
          name: rpm-verify
          path: rpm

      - name: Install rpm
        run: dnf install -y rpm/*.rpm

      - name: Check installed files
        run: |
          rpm -ql openclsolarsystem
          if ldd /usr/bin/OpenCLSolarSystem | grep "not found"; then
            echo "::error::Unresolved shared libraries on ${{ matrix.name }}"
            exit 1
          fi
          dotnet --list-runtimes | grep -q "Microsoft.NETCore.App 10\." \
            || { echo "::error::.NET 10 runtime not installed on ${{ matrix.name }}"; exit 1; }
          echo "OK: openclsolarsystem installs and resolves on ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
